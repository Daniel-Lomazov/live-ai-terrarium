key_risks:
  - risk: "Nested sandbox mirrors leak into outer Git history."
    severity: "high"
    consequence: "The outer project repo becomes a mixed audit surface, history bloats quickly, and the designed separation between host-controlled project history and sandbox execution history is lost."
    source_refs:
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q5.1-Q5.2"
      - "docs/v1-architecture-brief.md :: Non-Negotiable Constraints"
  - risk: "Milestone tags and release tags share the same namespace or are created as lightweight tags."
    severity: "medium"
    consequence: "Important checkpoints lose provenance and later release archaeology becomes weak or ambiguous."
    source_refs:
      - "https://git-scm.com/book/en/v2/Git-Basics-Tagging :: annotated tags vs lightweight tags"
  - risk: "Outer repo workflow drifts into branch sprawl despite the single-main intent."
    severity: "medium"
    consequence: "Auditability drops and the repository discipline diverges from the operator expectation stated for this slice."
    source_refs:
      - "user clarification :: single main local branch"
      - "AGENTS.md :: Git Discipline"
  - risk: "Backups remain in the same active workspace or same single disk location."
    severity: "high"
    consequence: "The local-first durability model degenerates into a single failure domain and weakens recovery claims."
    source_refs:
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q12.3"
  - risk: "v1.0.0 is tagged before the Milestone 1 proof is documented."
    severity: "high"
    consequence: "The release tag overstates project maturity and breaks the meaning of the version boundary."
    source_refs:
      - "docs/v1-architecture-brief.md :: Milestone 1 Contract"
