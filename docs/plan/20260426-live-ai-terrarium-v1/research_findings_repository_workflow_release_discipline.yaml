    - path: "docs/milestones/"
      purpose: "Holds milestone definitions and evidence notes aligned with milestone tags."
      notes: "Prevents ad hoc tag creation without a written checkpoint definition."
      source_refs:
        - "docs/v1-architecture-brief.md :: Implementation Order"
  ignored_or_external:
    - path: ".local/sandbox-mirrors/"
      purpose: "Dedicated landing zone for mirrored sandbox Git repositories or bare mirrors."
      notes: "Keeps inner Git history available locally without mixing it into outer repo history."
      source_refs:
        - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q5.1-Q5.2"
    - path: ".local/exports/"
      purpose: "Controlled export landing zone for artifacts leaving the sandbox."
      notes: "Matches the hard-boundary model and should stay ignored by outer Git."
      source_refs:
        - "docs/v1-architecture-brief.md :: Selected V1 Architecture / Boundary crossings"
    - path: ".local/backups/"
      purpose: "Local-first backup area for outer repo snapshots and mirrored sandbox evidence."
      notes: "A sibling path outside the repo root is even safer if the operator wants stricter failure-domain separation."
      source_refs:
        - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q12.1-Q12.3"
implementation_notes:
  - note: "Initialize the outer repository at the workspace root and set the initial branch explicitly to main, because the workspace is not yet under Git and Git defaults are version-dependent."
    source_refs:
      - "workspace check :: not a git repository"
      - "https://git-scm.com/docs/git-init :: --initial-branch"
  - note: "The first outer commit should capture the current source-of-truth docs as the baseline state so later changes remain traceable to the questionnaire-derived contract."
    source_refs:
      - "AGENTS.md :: Source of truth / Git Discipline"
      - "workspace structure :: only AGENTS.md, docs/, and .github/ are present"
  - note: "Outer history should stay on main. Branch-and-continue is still valid for sandbox failure preservation, but that branching belongs to sandbox mirrors, not to the outer project repo."
    source_refs:
      - "user clarification :: single main local branch"
      - "AGENTS.md :: Git Discipline"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q5.3"
  - note: "Milestone tags should use a namespace that cannot be mistaken for releases. Final release tagging should reserve plain semver names such as v1.0.0 for milestone-proof commits only."
    source_refs:
      - "docs/v1-architecture-brief.md :: Milestone 1 Contract"
      - "https://git-scm.com/book/en/v2/Git-Basics-Tagging :: release points"
  - note: "Use annotated tags for both milestone tags and the final release tag so each important checkpoint carries tagger metadata and a durable message."
    source_refs:
      - "https://git-scm.com/book/en/v2/Git-Basics-Tagging :: annotated tags vs lightweight tags"
  - note: "Keep sandbox mirrors, exports, snapshots, and backup folders out of the tracked tree through ignore rules or an external path. The source docs require those artifacts for audit and recovery, but they do not require them to live in outer Git history."
    source_refs:
      - "AGENTS.md :: Repository Mission / Git Discipline"
      - "docs/v1-architecture-brief.md :: Boundary crossings / Non-Negotiable Constraints"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q12.3"
  - note: "The final v1.0.0 tag is gated by the proof milestone, not by feature completeness beyond v1 scope. If the repo does not yet contain evidence of 10 stable cycles, rollback, and observability, the final release tag is premature."
    source_refs:
      - "docs/v1-architecture-brief.md :: The first release is a proof loop / Milestone 1 Contract"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q15.1-Q15.3"
