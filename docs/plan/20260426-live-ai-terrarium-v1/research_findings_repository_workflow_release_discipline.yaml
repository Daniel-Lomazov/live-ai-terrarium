      notes: "Keeps milestone and release intent visible in the repo rather than relying only on tag names."
      source_refs:
        - "docs/v1-architecture-brief.md :: The first release is a proof loop"
    - path: "docs/releases/v1.0.0.md"
      purpose: "Captures the final release checklist, evidence links, and milestone proof summary that justify the v1.0.0 tag."
      notes: "Should point back to the Milestone 1 contract and the exact evidence produced by the run."
      source_refs:
        - "docs/v1-architecture-brief.md :: Milestone 1 Contract"
