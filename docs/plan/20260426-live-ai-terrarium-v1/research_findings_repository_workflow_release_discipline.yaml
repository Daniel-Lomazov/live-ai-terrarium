  current_state: "The workspace root is not currently a Git repository, and there is no existing repo-level release or ignore scaffold."
  non_goals:
    - "Do not merge sandbox-inner Git history into the outer project history."
    - "Do not rely on long-lived outer feature branches for v1 workflow discipline."
    - "Do not treat local sandbox state as the authoritative recovery source."
  source_refs:
    - "AGENTS.md :: Git Discipline"
    - "docs/v1-architecture-brief.md :: Selected V1 Architecture / Milestone 1 Contract"
    - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q5.1-Q5.3, Q12.3, Q15.1-Q15.3"
