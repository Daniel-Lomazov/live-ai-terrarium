plan_id: "20260426-live-ai-terrarium-v1"
objective: "Produce implementation-ready research for the repository workflow and release discipline slice of a local-first Live AI Terrarium v1 project."
focus_area: "outer git repo initialization, single-main-branch discipline, tag strategy, release path to v1.0.0, separation from sandbox-inner git mirror, milestone tagging, local backup expectations"
created_at: "2026-04-26"
created_by: "gem-researcher"
status: "completed"
tldr: |
  - The workspace root is not yet a Git repository, so the outer project history needs to be initialized from zero at the live-ai-terrarium root.
  - The source documents consistently require auditable history, externally authoritative storage, and sandbox Git mirroring without giving sandbox-local history authority over the host project.
  - The clean outer workflow is a single local main branch with small traceable commits, annotated milestone tags that do not overlap the release namespace, and a final annotated v1.0.0 tag only after the Milestone 1 contract is evidenced.
  - Sandbox branch-and-continue remains valid for failure preservation inside the sandbox mirror, but that behavior should not turn into long-lived outer project branches.
  - Local-first backup expectations imply at least one separate backup copy of the outer repo and one separate backup copy of mirrored sandbox state outside the active working tree.
research_metadata:
  methodology: "Read AGENTS.md and the two source-of-truth documents, searched the workspace for Git or release material, verified current outer-repo Git state, and checked Git documentation for initialization and tagging behavior."
  scope: "Repository workflow and release discipline for the outer live-ai-terrarium workspace only; excludes implementation code and excludes sandbox-internal branching mechanics except where they affect separation from the outer repo."
  confidence: "high"
  coverage: 95
  decision_blockers: 0
  research_blockers: 0
