    - "https://git-scm.com/docs/git-init :: --initial-branch"
concrete_components:
  - name: "Outer repository root"
    purpose: "Authoritative project history for source, docs, and release tags."
    recommended_state: "Initialize at c:/Users/lomaz/live-ai-terrarium with main as the initial branch."
    source_refs:
      - "workspace check :: outer root is not yet a Git repo"
      - "https://git-scm.com/docs/git-init :: --initial-branch"
  - name: "Single local main branch"
    purpose: "Carries the disciplined project history without long-lived outer branch divergence."
    recommended_state: "All outer repo commits land on main; history remains linear enough to audit without branch sprawl."
    source_refs:
      - "user clarification :: disciplined commits and tags on a single main local branch"
      - "AGENTS.md :: Git Discipline"
  - name: "Annotated milestone tags"
    purpose: "Mark proof checkpoints and architecture-complete states without pretending to be releases."
    recommended_state: "Use annotated tags in a milestone-only namespace such as milestone/v1-* or m1-*; avoid lightweight tags for durable markers."
    source_refs:
      - "docs/v1-architecture-brief.md :: Milestone 1 Contract / Implementation Order"
      - "https://git-scm.com/book/en/v2/Git-Basics-Tagging :: annotated tags vs lightweight tags"
  - name: "Final release tag v1.0.0"
    purpose: "Represents the first proof release after the Milestone 1 success contract is satisfied."
    recommended_state: "Create as an annotated tag only after the repo contains evidence for 10 stable cycles, full logs, rollback, and per-cycle diff or score or decision visibility."
    source_refs:
      - "docs/v1-architecture-brief.md :: Milestone 1 Contract"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q15.1-Q15.3"
      - "https://git-scm.com/book/en/v2/Git-Basics-Tagging :: release points and annotated tags"
  - name: "Sandbox mirror boundary"
    purpose: "Preserves the reversibility contract without contaminating outer project history."
    recommended_state: "Store mirrored sandbox repos in a dedicated ignored or external path; never stage nested sandbox .git data in the outer repo."
    source_refs:
      - "AGENTS.md :: Repository Mission / Git Discipline"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q5.1-Q5.3"
  - name: "Local backup set"
    purpose: "Meets the local-first durability requirement for both outer repo state and mirrored sandbox evidence."
    recommended_state: "Maintain a second copy of the outer repo and a second copy of mirrored sandbox artifacts outside the active working tree."
    source_refs:
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md :: Q12.1-Q12.3"
      - "docs/v1-architecture-brief.md :: Non-Negotiable Constraints"
recommended_files_and_directories:
  tracked:
    - path: ".gitignore"
      purpose: "Prevents sandbox mirrors, exports, snapshots, caches, and local backups from entering outer project history."
      notes: "This is the minimum repo-discipline file because no ignore policy exists yet."
