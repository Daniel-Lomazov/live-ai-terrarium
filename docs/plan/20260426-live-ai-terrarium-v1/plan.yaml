observation_mode_contract:
  default_mode: observation-only
  allowed_without_mode_switch_receipt:
    - observe
  mode_switch_rule: "mode switch is allowed only when the approval policy permits it and the dispatcher emits an active mode-switch receipt bound to the same run or instance scope and current mode context."
  denied_without_mode_switch_receipt:
    - pause
    - resume
    - branch
    - clone
    - reset
    - rollback
  emergency_path_rule: "Emergency handling is denied through the standard action list and may flow only through an explicit emergency command path if that path is separately defined, policy-gated, and audited."
