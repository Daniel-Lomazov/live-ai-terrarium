pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: "API, CLI/TUI, and Streamlit drift into different command semantics or lifecycle coverage and stop sharing one backend behavior."
      likelihood: medium
      impact: critical
      mitigation: "Freeze canonical command envelopes first, keep adapters thin, and block surface work until dispatcher plus audit contracts exist."
    - scenario: "Sandbox runtime leaks host access, secrets, or network reach through Docker defaults or an unsafe command interface."
      likelihood: medium
      impact: critical
      mitigation: "Pin one hardened runtime profile, enforce one controlled export directory with no other shared mounts, and require the focused boundary checklist before proof work."
    - scenario: "Canonical cycle records, audit events, reproducibility manifests, snapshots, and full-log bundles are incomplete or inconsistent, making rollback and reproducibility non-credible."
      likelihood: medium
      impact: critical
      mitigation: "Implement filesystem-first contracts early, require run-start reproducibility manifests plus full-log emission in proof tests, and make release proof depend on rollback, branch, and audit-linkage evidence."
    - scenario: "Observation-only default and explicit mode switching are implemented inconsistently across surfaces, weakening auditability and operator safety."
      likelihood: medium
      impact: high
      mitigation: "Freeze one auditable mode-switch command path, project mode state through one read model, and require parity checks across API, CLI/TUI, and dashboard."
    - scenario: "The no-regression baseline or gate ordering is ambiguous, causing false accepts or false rollbacks across the ten-cycle proof."
      likelihood: medium
      impact: high
      mitigation: "Freeze the baseline in the spec pack, encode it in contract tests, and keep Pareto outputs informational until gates pass."
    - scenario: "The outer repository reaches v1.0.0 without disciplined main-only history, milestone tags, or a clean proof checklist."
      likelihood: low
      impact: high
      mitigation: "Initialize git in wave 1, document tag policy immediately, and gate the final tag behind the milestone checklist and release note bundle."
  assumptions:
    - A single local admin can approve sensitive actions as long as approvals are audit-logged.
    - The local machine can run Docker Desktop for Windows and a Python environment suitable for Streamlit and pytest.
    - The first v1 proof uses simple test fixtures rather than broad real-world workloads.
    - The sandbox-inner git mirror remains logically separate from the outer repo history at every stage.
