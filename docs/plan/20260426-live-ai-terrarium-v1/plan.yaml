assumptions:
  - A single Python codebase is the v1 baseline, using FastAPI, Pydantic, Typer, Rich, Streamlit, pytest, and Docker CLI.
  - Durable host-controlled state lives under %LOCALAPPDATA%/LiveAITerrarium/state and backups live under %LOCALAPPDATA%/LiveAITerrarium/backups.
  - Audit events use a SHA-256 hash chain scoped per run.
  - The no-regression baseline is the last accepted stable cycle for the active run.
  - Per-cycle file snapshots happen every cycle; full workspace snapshots happen every 5 cycles and on every stop condition.
  - Milestone tags use the namespace milestone/v1-* and the final release tag is the annotated tag v1.0.0.
  - The only sanctioned sandbox egress path is /workspace/.gb/outbox; no other sandbox-host shared mount or direct host path is available in v1.
  - Repeated crashes default to 3 consecutive crash-terminated cycles per run; log silence defaults to 60 seconds without brokered log or heartbeat activity during an active cycle.
  - Resource overuse defaults to container hard-limit breach or sustained CPU or memory usage above 90 percent of the configured budget for 30 seconds.
  - Branch-and-continue creates a sandbox-inner git branch plus external mirror evidence; the outer repository remains single-branch main except for annotated milestone and release tags.
  - Selected v1 parity actions are observe, mode switch, pause, resume, branch, clone, reset, and rollback across API, CLI/TUI, and dashboard surfaces.
