tldr: |
  Wave 1 freezes the questionnaire-backed v1 contract, operator surface design, and outer-repo release discipline.
  Wave 2 bootstraps the Python package, canonical contracts, hardened runtime baseline, and host-controlled storage paths.
  Wave 3 implements the executable sandbox boundary plus append-only export contract and the canonical command path.
  Wave 4 adds append-only audit plus approval flow, host-side orchestration and gateway control, and deterministic evaluator gates.
  Wave 5 adds evidence-first recovery plus a dedicated run-evidence slice for run-start reproducibility manifests, immutable build identity, brokered full-log capture, and cycle-to-audit linkage.
  Wave 6 builds the shared read model and runs the focused boundary and security review over the new evidence.
  Wave 7 delivers API, CLI/TUI, and Streamlit adapters with parity for observe, mode switch, pause, resume, branch, clone, reset, and rollback.
  Wave 8 executes the ten-cycle proof harness, browser validation, and documentation refresh.
  Wave 9 packages the proof bundle and creates milestone tags on main.
  Wave 10 creates the final annotated v1.0.0 tag only after the proof checklist is complete.
