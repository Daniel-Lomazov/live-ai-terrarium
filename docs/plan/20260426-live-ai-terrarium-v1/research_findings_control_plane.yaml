implementation_notes:
  architecture_shape:
    - Start with one process and strict module boundaries because the docs require logical separation but do not require microservices in v1.
    - Keep adapters thin. API, CLI/TUI, and Streamlit should translate inputs and render outputs, but command validation, approval checks, execution, and audit writes should live in backend services only.
    - Keep read models separate from command execution. Query handlers can read per-cycle records and command events, while control handlers mutate only host-side orchestration state.
  role_boundaries:
    - Orchestrator owns control execution, lifecycle changes, failure handling, snapshots, rollback, and branching.
    - Model Gateway owns model access, rate limits, and credentials. It is not part of the operator control backend.
    - Inner Agent never calls host-control commands directly. Its typed tool API is separate from human control-plane commands.
    - Evaluator can contribute decision status and regression checks but should not own operator approvals or UI logic.
    - Dashboard, CLI/TUI, and API are presentation and transport surfaces only.
    - Observer/Annotator can emit annotations linked to runs or cycles but should not override core gates or audit state.
  command_categories:
    - query commands: list and inspect projects, glass-boxes, runs, cycles, summaries, failures, and audit history.
    - control commands: mode switch, pause, resume, branch, clone, reset, rollback, and emergency stop workflows.
    - approval-required minimum set: reset, rollback, scoring changes, task injection, constraint modification, and any command that turns observation-only into an active control mode.
    - policy-declared set: branch and clone may be direct admin operations or approval-gated operations, but the policy must declare that explicitly rather than leaving it implicit.
  canonical_command_schema:
    required_fields:
      - command_id
      - command_name
      - issued_at
      - actor_id
      - actor_role
      - surface
      - target_kind
      - target_id
      - scope_refs
      - params
      - mode_context
      - reason
      - idempotency_key
    notes:
      - scope_refs should support project_id, glassbox_id, experiment_id, run_id, and cycle_id when applicable.
      - surface should distinguish api, cli, tui, and dashboard for audit traceability without changing command semantics.
      - mode_context should capture whether the system was in observation-only or explicit control mode when the command was issued.
  canonical_event_schema:
    required_fields:
      - event_id
      - command_id
      - event_type
      - occurred_at
      - actor_id
      - actor_role
      - target_kind
      - target_id
      - scope_refs
      - payload
      - previous_event_hash
      - event_hash
    required_event_types:
      - command.requested
      - command.approval_requested
      - command.approved
      - command.rejected
      - command.started
      - command.completed
      - command.failed
    notes:
      - Keep command events separate from cycle records; link them by scope and command_id rather than merging both concepts into one document.
      - Failure events should reference any incident report or rollback branch created by the failure policy.
  approval_schema:
    required_fields:
      - approval_id
      - command_id
      - requested_at
      - requested_by
      - approval_status
      - resolved_at
      - resolved_by
      - approval_reason
    notes:
      - Single-user admin does not remove the approval record; it only collapses requester and approver identity to the same actor when necessary.
      - Approval events still need to be logged as distinct audit events.
  storage_shape:
    - Keep v1 storage local-first and host-controlled, matching the docs. A file-backed append-only ledger and file-backed per-cycle records are consistent with the selected v1 storage model.
    - Treat the audit ledger and per-cycle records as different stores with cross-references, not as one overloaded artifact.
    - Preserve human-readable IDs and internal UUIDs together so logs and dashboards remain navigable without sacrificing referential integrity.
validation_checks:
  - check: Surface parity
    success_condition: The same logical command submitted through API, CLI/gb, Rich TUI, and Streamlit normalizes to the same canonical command payload except for surface metadata.
  - check: Observation-only default
    success_condition: Read-only commands succeed by default, while control commands are blocked or approval-gated until an explicit audited mode-switch command is accepted.
  - check: Approval enforcement
    success_condition: Approval-required commands cannot transition to started or completed without an approval record and matching audit events.
  - check: Audit integrity
    success_condition: Audit events are append-only, externally controlled, and hash-chain verification detects deletion, reordering, or mutation.
  - check: Role boundary enforcement
    success_condition: Inner-agent code paths cannot invoke orchestrator lifecycle controls, audit-log writers, or dashboard-facing mutation paths.
  - check: Record separation
    success_condition: Per-cycle observability records remain the source of truth for cycle views, while control-plane audit events remain the source of truth for operator actions.
  - check: Failure workflow
    success_condition: Forbidden action attempt, repeated crash, syntax failure, score drop, resource overuse, or log silence triggers pause, evidence capture, and reported recovery steps consistent with the documented failure policy.
  - check: Dashboard integration
    success_condition: Streamlit actions display command receipt, approval state, and command outcome while reading the same summaries and drill-down records as CLI/TUI views.
key_risks:
  - risk: Adapter drift
    impact: API, CLI/TUI, and Streamlit may evolve different command names or payload shapes unless all surfaces share the same schemas and dispatcher.
  - risk: Role leakage
    impact: Without strict module boundaries, the dashboard, evaluator, or inner-agent code could start owning orchestration decisions that belong to the host-side control layer.
  - risk: Audit and observability conflation
    impact: Combining cycle records and operator command events into one store will weaken both replay clarity and audit guarantees.
  - risk: Ambiguous approval taxonomy
    impact: If the approval-required command set is not fixed early, destructive operations may ship with inconsistent policy across surfaces.
  - risk: Local-file integrity under concurrent writes
    impact: A local-first file-backed ledger is consistent with v1, but it needs disciplined append semantics and verification to avoid corruption or partial writes.
  - risk: Overcoupling to transport
    impact: If the API layer becomes the only real backend, local CLI and Streamlit may depend on HTTP even when a direct in-process backend call would be simpler and more reliable for v1.
  - risk: Scope expansion
    impact: Chat control, multi-agent concerns, streaming-first observability, or database-first persistence can consume the slice before the v1 proof loop exists.
planner_ready_tasks:
  - task: Define canonical command, event, approval, and ID schemas.
    done_when:
      - One schema package is shared by API, CLI/TUI, and Streamlit.
      - Required fields and event types are fixed and documented.
      - Command categories and approval requirements are explicit.
  - task: Build the shared command dispatcher and policy layer.
    done_when:
      - All operator commands enter through one dispatcher.
      - Observation-only defaults and approval rules are enforced centrally.
      - Surface metadata is recorded without changing command semantics.
  - task: Implement append-only audit logging with hash chaining.
    done_when:
      - Command lifecycle events are persisted outside the sandbox.
      - Verification detects tampering or ordering gaps.
      - Command receipts can be queried by command_id, run_id, and cycle_id.
  - task: Implement host-side lifecycle control services.
    done_when:
      - Pause, resume, branch, reset, rollback, clone, and mode switching are executed only by orchestrator-owned services.
      - Failure handling follows pause, snapshot, branch when useful, rollback or restore, then report.
  - task: Add the local API adapter over the shared backend.
    done_when:
      - Programmatic endpoints reuse the same schemas and dispatcher.
      - Query and command routes are separated.
      - API responses expose normalized command receipts and status views.
  - task: Add the gb CLI and Rich TUI adapters.
    done_when:
      - Terminal commands call the same query and command services as the API.
      - TUI views read canonical records and audit events.
      - Approval state and command outcomes are visible in terminal flows.
  - task: Add the Streamlit dashboard control and drill-down views.
    done_when:
      - Streamlit actions call the same backend command path.
      - Dashboard summaries and drill-down views come from canonical records.
      - Sensitive actions show approval state and audit receipts.
  - task: Add control-plane validation tests.
    done_when:
      - Surface parity, observation-only, approval enforcement, audit integrity, and role-boundary tests all pass.
      - Failure-path tests prove evidence-first handling and reporting.
