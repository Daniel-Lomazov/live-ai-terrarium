plan_id: 20260426-live-ai-terrarium-v1
objective: Produce implementation-ready research for the control plane slice of a local-first Live AI Terrarium v1 project.
focus_area: shared command backend, API, CLI/TUI, Streamlit dashboard integration, role boundaries, command/event schemas
created_at: 2026-04-26
created_by: GitHub Copilot GPT-5.4
status: completed
sources:
  - AGENTS.md
  - .github/live_ai_terrarium_questionnaire_working_file_v_1_0.md
  - docs/v1-architecture-brief.md
repo_state:
  implementation_surface: doc_only
  note: The repository currently contains source-of-truth docs only, so the file layout below is a recommended first implementation slice derived from the docs rather than an extension of existing code.
slice_goal: |
  Build one shared control-plane backend that owns all operator commands, approvals, and audit events for v1.
  The backend must serve API endpoints, CLI/gb commands, Rich TUI actions, and Streamlit dashboard controls through the same command path.
  The slice must preserve observation-only as the default mode, expose explicit control operations, and keep all sensitive actions auditable under a single-user admin model.
concrete_components:
  - name: control command backend
    responsibility: Canonical entry point for all operator-issued commands across API, CLI/TUI, and Streamlit.
    required_behavior:
      - Normalizes surface-specific input into one command envelope.
      - Applies role, mode, and approval policy before execution.
      - Dispatches only to orchestrator-owned control operations.
      - Emits append-only audit events for requested, approved, rejected, started, completed, and failed states.
    source_basis:
      - AGENTS.md: one shared backend, explicit auditable commands, typed validated interfaces.
      - questionnaire: Q3.2, Q9.3, Q10.2, Q10.3.
  - name: command policy and approval gate
    responsibility: Distinguish read-only, control, and approval-required commands under observation-first defaults.
    required_behavior:
      - Observation commands remain available by default.
      - Explicit control commands exist but are denied or gated unless mode and approval policy allow them.
      - Sensitive actions require logged approval even in single-user admin mode.
    source_basis:
      - AGENTS.md: observation-only default; all mode changes explicit through shared API path.
      - questionnaire: Q3.1, Q3.2, Q10.3.
  - name: audit and event ledger
    responsibility: Persist command lifecycle events as the authoritative control-plane history.
    required_behavior:
      - Append-only writes controlled outside the sandbox.
      - Hash-chain records for tamper evidence.
      - Cross-reference command events to project, glass-box, experiment, run, and cycle IDs.
      - Separate audit events from per-cycle observability records while linking them by scope.
    source_basis:
      - questionnaire: Q2.3, Q4.3, Q7.1, Q7.2, Q11.3.
      - architecture brief: audit logs append-only and hash-chained; per-cycle records are source of truth.
  - name: orchestrator control service
    responsibility: Own lifecycle-changing operations such as pause, resume, branch, reset, rollback, clone, and mode switching.
    required_behavior:
      - Executes only host-side operations outside the sandbox.
      - Preserves evidence first on failure paths: pause, snapshot, branch if needed, rollback or restore, then report.
      - Never delegates containment, audit, or storage authority to the inner agent.
    source_basis:
      - AGENTS.md: failure handling preserves evidence first; storage truth is outside sandbox.
      - questionnaire: Q3.3, Q10.1, Q11.2.
  - name: API adapter
    responsibility: Expose local programmatic endpoints over the shared backend without duplicating business rules.
    required_behavior:
      - Accept command requests and query requests.
      - Return normalized command receipts and status views.
      - Reuse the same schemas as CLI/TUI and dashboard.
    source_basis:
      - questionnaire: Q10.2.
      - architecture brief: dashboard and CLI views operate on same control API.
  - name: CLI and Rich TUI adapter
    responsibility: Provide gb command entrypoints and terminal-native inspection over shared backend data.
    required_behavior:
      - Convert terminal arguments and prompts into the same command envelope used by API and dashboard.
      - Read canonical per-cycle records and command events instead of owning separate state.
      - Surface approval and command receipts clearly for auditability.
    source_basis:
      - questionnaire: Q4.2, Q10.2.
      - AGENTS.md: dashboard and CLI views read the same records.
  - name: Streamlit dashboard adapter
    responsibility: Present control and observability views without becoming a second control implementation.
    required_behavior:
      - Read aggregated summaries and drill into per-cycle records from the same backend-owned data.
      - Submit all toggles and control actions through the same command backend path.
      - Display command receipts, approval state, and audit trail for sensitive actions.
    source_basis:
      - questionnaire: Q4.2, Q4.3, Q10.2.
      - architecture brief: Streamlit reads and controls through shared API.
  - name: shared schemas package
    responsibility: Define stable typed contracts for commands, approvals, events, IDs, and control status views.
    required_behavior:
      - Prevent API, CLI, TUI, and dashboard payload drift.
      - Encode role boundaries and target scope explicitly.
      - Support both human-readable IDs and internal UUID references.
    source_basis:
      - questionnaire: Q7.2, Q8.2, Q9.3.
