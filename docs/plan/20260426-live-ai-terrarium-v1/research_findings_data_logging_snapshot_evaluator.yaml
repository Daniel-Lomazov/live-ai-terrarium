recommended_files_and_directories:
  durable_storage_principle:
    summary: "Keep durable artifacts in a host-controlled filesystem tree outside the sandbox. Treat summaries as rebuildable derivatives and audit logs as append-only."
    source_refs:
      - "AGENTS.md:16,29,46"
      - "docs/v1-architecture-brief.md:53,117-121"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:126-134,273-281"
  runtime_layout:
    - path: "storage/projects/{project_id}/project.json"
      purpose: "Project-level metadata, UUID, human label, and default policy references."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/glassbox.json"
      purpose: "Glass-Box identity, runtime boundary metadata, and current stable-state reference."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/experiment.json"
      purpose: "Experiment identity, task seed policy, comparison constraints, and normalization settings."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/run.json"
      purpose: "Run envelope with UUID, readable ID, seed, limits, model scope, baseline refs, and latest accepted cycle pointer."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/logs/audit.jsonl"
      purpose: "Append-only tamper-evident command and lifecycle log for the run."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/logs/checkpoints/"
      purpose: "Periodic chain verification checkpoints and crash-recovery markers."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/cycles/{cycle_id}/cycle.json"
      purpose: "Canonical cycle record with required observability fields and artifact references."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/cycles/{cycle_id}/diff/"
      purpose: "Human-readable patch plus machine-readable diff summary and touched-file stats."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/cycles/{cycle_id}/snapshots/files/"
      purpose: "Per-cycle file-level snapshot payloads keyed by relative path and content hash."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/cycles/{cycle_id}/snapshots/manifest.json"
      purpose: "Snapshot manifest mapping files, hashes, sizes, and reconstruction ordering."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/cycles/{cycle_id}/evaluator/"
      purpose: "Gate results, regression report, acceptance decision, and candidate metrics."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/cycles/{cycle_id}/incidents/incident.json"
      purpose: "Per-failure report when stop conditions or rollback-worthy events occur."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/snapshots/full/{snapshot_id}/"
      purpose: "Periodic full filesystem snapshot metadata, archive payload, and restore manifest."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/mirror/git/"
      purpose: "External Git mirror refs, branch lineage, and accepted-versus-failing path references."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/summaries/run_summary.json"
      purpose: "Derived rollup over canonical cycle records for dashboard and CLI consumption."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/summaries/pareto_summary.json"
      purpose: "Pareto-valid candidate set and objective tradeoff summary."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/runs/{run_id}/summaries/regression_summary.json"
      purpose: "Derived regression counts, latest stable baseline, and no-regression proof inputs."
    - path: "storage/projects/{project_id}/glassboxes/{glassbox_id}/experiments/{experiment_id}/summaries/experiment_summary.json"
      purpose: "Cross-run normalized rollup for side-by-side comparison and trend reporting."
  layout_notes:
    - "Summaries should remain rebuildable from cycle records and incident artifacts; they should never become the sole authority."
    - "Keep append-only logs under a dedicated logs subtree so retention, backup, and verification policies can differ from mutable derived summaries."
    - "Separate per-cycle snapshots from periodic full snapshots because the source docs explicitly require both."
    - "Keep Git mirror references adjacent to run artifacts but logically separate from canonical cycle records; Git is part of reversibility, not a replacement for records."
  source_refs:
    - "AGENTS.md:16-19,33,44-46"
    - "docs/v1-architecture-brief.md:21,26-28,58-78,104-107,117-128"
    - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:109-176,251-302"
implementation_notes:
  - note: "Readable IDs should express hierarchy and sequence, while UUIDs preserve referential integrity. Timestamps belong in metadata fields rather than in the primary identifier."
    rationale: "This is explicit in the experiment model and avoids coupling identity to wall-clock ordering."
    source_refs:
      - "docs/v1-architecture-brief.md:73-78"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:167-169"
  - note: "Treat cycle.json as the canonical record envelope for one cycle. At minimum it should carry task, diff reference, score, test result, errors, model identity, prompt reference, token usage, latency, and CPU/RAM/disk usage, plus stable pointers to evaluator, snapshot, and incident artifacts."
    rationale: "The architecture brief lists the required minimum fields and the questionnaire says aggregated views must be derived from per-cycle records."
    source_refs:
      - "docs/v1-architecture-brief.md:58-71,102-103"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:94-113"
  - note: "Append-only JSONL logs should be run-scoped, externally controlled, and hash-chained. The practical minimum record envelope is schema version, sequence number, timestamp, run/cycle refs, event type, payload, previous hash, and current record hash."
    rationale: "The docs require append-only externally controlled tamper-evident logs; the requested slice explicitly calls for JSONL/hash-chained logs."
    source_refs:
      - "AGENTS.md:16,29"
      - "docs/v1-architecture-brief.md:53"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:67-70"
  - note: "Store both a human-readable unified diff and a machine-readable diff summary per cycle. The patch supports inspection, while summary stats support dashboards, regression checks, and trend views."
    rationale: "The milestone requires visible diff/score/decision per cycle, and per-cycle records drive both inspection and aggregation."
    source_refs:
      - "AGENTS.md:33-46"
      - "docs/v1-architecture-brief.md:30,95,107"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:330-344"
  - note: "Per-cycle file snapshots and periodic full filesystem snapshots solve different recovery problems and should remain separate artifact types with explicit manifests and restore metadata."
    rationale: "The docs select both mechanisms and do not treat one as a substitute for the other."
    source_refs:
      - "AGENTS.md:18-19"
      - "docs/v1-architecture-brief.md:27,105-106"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:119-134"
  - note: "Incident reports should be emitted whenever stop conditions or failure responses trigger. The minimum useful envelope is incident ID, run/cycle refs, stop condition, severity, evidence refs, action taken, branch/rollback refs, and resolution status."
    rationale: "The source docs require incident report per failure plus aggregated failure reporting, but do not define a schema; the envelope above is the minimum set implied by the failure contract."
    source_refs:
      - "AGENTS.md:45"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:244-260"
  - note: "Gate evaluation should remain ordered and deterministic. A practical v1 order is: forbidden-action/resource/log-silence checks, syntax gate, required tests gate, regression gate, then optional stability/improvement and Pareto comparison among gate-valid candidates."
    rationale: "The docs treat safety/correctness gates as the trust anchor and Pareto as secondary."
    source_refs:
      - "docs/v1-architecture-brief.md:28,104-105,126"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:138-155,244-252"
  - note: "No-regression acceptance needs one explicit stable baseline. The least surprising v1 choice is the last accepted cycle within the same run, with cross-run normalization reserved for experiment summaries rather than acceptance."
    rationale: "The docs require deterministic keep-if-no-regression acceptance, rollback to the last stable state, and normalized cross-run comparison. They do not explicitly define the baseline, so planner sign-off is required before implementation."
    source_refs:
      - "docs/v1-architecture-brief.md:75-78,104-106"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:151-176,286-302"
  - note: "Pareto summaries should only consider gate-valid candidates. Keep the frontier artifact separate from keep/reject decisions so comparison remains explanatory rather than authoritative."
    rationale: "The selected scoring model is gate-first with Pareto comparison of valid candidates, and score-based acceptance is explicitly rejected as the v1 trust anchor."
    source_refs:
      - "docs/v1-architecture-brief.md:28"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:146-155"
validation_checks:
  - check: "Cycle record completeness"
    method: "Verify every cycle directory contains cycle.json and that each record includes the minimum required observability fields plus stable artifact references."
    source_refs:
      - "docs/v1-architecture-brief.md:58-71,102-103"
  - check: "Shared-record read model consistency"
    method: "Rebuild run summaries and dashboard/CLI drill-down views from cycle records only and confirm they match rendered diff/score/decision outputs."
    source_refs:
      - "AGENTS.md:44"
      - "docs/v1-architecture-brief.md:26,103-104"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:105-113"
  - check: "Append-only chain integrity"
    method: "Recompute the JSONL hash chain for each run and confirm sequence continuity, previous-hash linkage, and checkpoint validity after normal completion and crash recovery."
    source_refs:
      - "docs/v1-architecture-brief.md:53"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:67-70"
  - check: "Rollback reconstructability"
    method: "Restore from the latest accepted stable state using per-cycle snapshots, full snapshot metadata, and external Git refs; confirm the reconstructed workspace matches recorded artifact hashes."
    source_refs:
      - "AGENTS.md:18-19,45"
      - "docs/v1-architecture-brief.md:105-106"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:119-134,251-260"
  - check: "Deterministic acceptance"
    method: "Run identical seeds/tasks/limits twice and confirm gate results, regression status, and keep/reject decisions are stable for the same inputs."
    source_refs:
      - "docs/v1-architecture-brief.md:75-78,104-105"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:151-176"
  - check: "Pareto summary scope"
    method: "Confirm Pareto summaries include only gate-valid candidates and do not override deterministic keep/reject outcomes."
    source_refs:
      - "docs/v1-architecture-brief.md:28"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:146-155"
  - check: "Failure artifact completeness"
    method: "Trigger each selected stop condition and confirm the system emits pause/snapshot/branch-or-rollback evidence plus an incident report and aggregated failure counters."
    source_refs:
      - "AGENTS.md:45"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:244-260"
key_risks:
  - risk: "Summary drift"
    impact: "If summaries are treated as authoritative instead of derived, dashboard and CLI can disagree with canonical evidence and rollback metadata."
    source_refs:
      - "AGENTS.md:44"
      - "docs/v1-architecture-brief.md:26"
  - risk: "Ambiguous regression baseline"
    impact: "No-regression acceptance can become nondeterministic or misleading if the baseline is not fixed before evaluator implementation."
    source_refs:
      - "docs/v1-architecture-brief.md:104-105"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:151-176"
  - risk: "Unbounded snapshot growth"
    impact: "Full-history retention plus per-cycle and periodic full snapshots can create storage pressure without an explicit cadence, compression, and hot/cold tier policy."
    source_refs:
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:120-134,273-281"
  - risk: "Audit chain breakage during crashes"
    impact: "Hash-chained JSONL logging needs checkpointing and recovery semantics or the tamper-evidence story becomes brittle after process interruption."
    source_refs:
      - "docs/v1-architecture-brief.md:53"
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:67-70"
  - risk: "Git mirror overreach"
    impact: "If Git becomes the implicit source of truth, non-code artifacts such as incident reports, resource traces, and chain verification can be lost or de-emphasized."
    source_refs:
      - "AGENTS.md:33,44-46"
      - "docs/v1-architecture-brief.md:27,58-71"
  - risk: "Failure taxonomy inconsistency"
    impact: "Without a normalized incident severity and status model, aggregated failure dashboards will not support clean comparisons across runs and models."
    source_refs:
      - ".github/live_ai_terrarium_questionnaire_working_file_v_1_0.md:244-260,293-302"
