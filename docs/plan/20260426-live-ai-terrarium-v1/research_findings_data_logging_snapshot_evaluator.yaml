plan_id: "20260426-live-ai-terrarium-v1"
objective: "Produce implementation-ready research for the data, logging, snapshot, and evaluator slice of a local-first Live AI Terrarium v1 project."
focus_area: "experiment hierarchy, IDs, artifact layout, JSONL/hash-chained logs, cycle records, diffs, snapshots, incident reports, evaluator gates, regression detection, Pareto summaries"
created_at: "2026-04-26"
created_by: "gem-researcher"
status: "completed"
tldr: |
  - The source of truth fixes the conceptual hierarchy as Project -> Glass-Box -> Experiment -> Run -> Cycle -> Mutation, with readable structured IDs plus internal UUIDs.
  - Per-cycle canonical records are the source of truth; aggregated summaries, dashboards, and CLI views must be derived from those records rather than maintaining a separate state model.
  - Durable truth is host-controlled and filesystem-first in v1; reversibility requires per-cycle file snapshots, periodic full snapshots, and sandbox Git mirrored externally.
  - Acceptance is deterministic and gate-first: a cycle is kept only when required gates pass and no regression is detected; Pareto comparison is secondary and only meaningful among valid candidates.
  - The repository currently contains only requirements artifacts, so storage layout, schemas, chain fields, snapshot cadence, and regression baselines remain planner-facing gaps rather than existing implementation constraints.
